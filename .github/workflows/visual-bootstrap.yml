# One-shot bootstrap: generate Linux Playwright baselines.
#
# Why this exists:
#   Visual baselines in tests/visual.spec.ts-snapshots/ were captured on macOS
#   (Apple Silicon dev laptops), so they're suffixed `-darwin.png`. Playwright
#   names snapshot files `<test>-<viewport>-<platform>.png`, and on Ubuntu CI
#   it looks for `*-linux.png` — which don't exist yet. Every visual test
#   fails with "A snapshot doesn't exist at ...-linux.png".
#
# What it does:
#   1. Runs Playwright with `--update-snapshots` on Ubuntu to generate the
#      missing *-linux.png baselines
#   2. Commits them back to the branch that triggered the run
#
# How to use:
#   Trigger manually from the Actions tab ("Run workflow") on `main` or any
#   branch that needs Linux baselines. After it commits, the regular visual.yml
#   workflow on the next push will diff against those baselines as regressions.
#
# When to delete this workflow:
#   Once Linux baselines exist in main and the team has a stable cadence for
#   regenerating them (e.g. `npm run test:visual:update` from a Linux runner
#   when intentional UI changes land). Leaving it in place is harmless — it
#   only runs on manual dispatch — but it's clutter.
#
# Why this lives in a separate workflow:
#   The main visual.yml is a *diff* gate (read-only); this one *writes* back
#   to the repo. Keeping them separate makes the security boundary explicit:
#   visual.yml never needs write permissions, only this bootstrap does.

name: visual-bootstrap

on:
  workflow_dispatch:

# We're committing back to the repo, so we need write access to contents.
permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the ref the workflow was dispatched on so we can push back.
          ref: ${{ github.ref }}
          # actions/checkout's default token can push back when contents:write
          # is granted above.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build

      # --update-snapshots regenerates every baseline. On a fresh run with no
      # *-linux.png files present, this writes them; if they exist already,
      # it overwrites them with whatever this run captured.
      - name: Generate Linux baselines
        env:
          NODE_ENV: production
        run: npm run test:visual:update

      # Stage only the snapshot directory — we never want this workflow to
      # commit anything else (a stray generated file would slip through).
      - name: Commit baselines
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add tests/visual.spec.ts-snapshots/
          if git diff --staged --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "Bootstrap Linux Playwright baselines

          Auto-generated by .github/workflows/visual-bootstrap.yml.
          Baselines captured on ubuntu-latest so visual.yml can diff
          against them on PRs."
          git push
